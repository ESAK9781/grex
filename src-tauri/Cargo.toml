[package]
name = "grex"
version = "0.1.1"
description = "Grex — Local multi-agent software factory with native PTYs, Git worktrees, embedded MCP server, and 5-subtab HTML changelog reviews"
authors = ["Grex Contributors"]
license = "MIT"
edition = "2021"
default-run = "grex"

[lib]
name = "grex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "grex"
path = "src/main.rs"

[[bin]]
name = "grex-mcp"
path = "src/bin/grex_mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.21"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

